version: "2"
sql:
  - schema: "internal/infra/database/postgresql/migrations"
    queries: "internal/infra/database/postgresql/queries"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc"
        out: "internal/infra/database/postgresql/sqlc"
        emit_json_tags: true
        emit_interface: true
        emit_prepared_queries: false
        emit_exact_table_names: false
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type: "float64"
