      carbs:
        $ref: '#/definitions/dto.MacroAdherenceDTO'
      date:
        type: string
      diet_plan_id:
        type: string
      fat:
        $ref: '#/definitions/dto.MacroAdherenceDTO'
      global_adherence:
        description: average of individual ratios; > 1.0 means over-target overall
        type: number
      protein:
        $ref: '#/definitions/dto.MacroAdherenceDTO'
    type: object
  dto.DietPlanOutputDTO:
    properties:
      calorie_intensity:
        type: string
      calories:
        type: number
      carbs:
        type: number
      fat:
        type: number
      fat_intensity:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      protein:
        type: number
      protein_intensity:
        type: string
      protocol_id:
        type: string
      water:
        type: number
    type: object
  dto.MacroAdherenceDTO:
    properties:
      adherence:
