info:
  contact: {}
paths:
  /assessment:
    get:
      description: Retrieves a list of all registered assessment profiles sorted by
        name.
      parameters:
      - description: User UUID to filter assessments by user
        in: query
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Assessment'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all assessments
      tags:
      - assessment
    post:
      consumes:
      - application/json
      description: Creates an assessment
      parameters:
      - description: Assessment Data
        in: body
        name: assessment
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAssessmentInputDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Assessment created successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input data
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new assessment
      tags:
      - assessment
  /assessment/{id}:
    delete:
      description: Permanently removes an assessment and their associated data from
        the system.
      parameters:
      - description: Assessment UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete assessment profile
      tags:
      - assessment
    get:
      description: Retrieves the basic information of a specific assessment.
      parameters:
      - description: Assessment UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Assessment'
        "404":
          description: Assessment not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get assessment by ID
      tags:
      - assessment
    put:
      consumes:
      - application/json
      description: Updates the weight, height, or other data of an existing assessment.
      parameters:
      - description: Assessment UUID
        in: path
        name: id
        required: true
        type: string
      - description: Updated Assessment Data
        in: body
        name: assessment
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAssessmentInputDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Assessment updated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid update data
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update assessment profile
      tags:
      - assessment
  /assessment/history:
    get:
      parameters:
      - description: User UUID
        in: query
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AssessmentHistoryEntryDTO'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Assessment history (shape evolution timeline)
      tags:
      - assessment
